name: Stanford Menu Notifier

on:
  schedule:
    # Runs daily at 01:00 UTC (18:00 PDT / 17:00 PST)
    # This queries and emails tomorrow's lunch menu
    - cron: '0 1 * * *'
  workflow_dispatch:
    # Allows manual trigger of the workflow from the GitHub actions tab
    inputs:
      custom_date:
        description: 'Target date formatted as M/D/YYYY (e.g. 5/31/2026). Leave empty for tomorrow.'
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run menu notifier
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
        SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      run: |
        if [ -n "${{ github.event.inputs.custom_date }}" ]; then
          python main.py --date "${{ github.event.inputs.custom_date }}"
        else
          python main.py
        fi
